# 墨舟 BookMate 反向代理
# - 只把 Nginx 暴露到公网，API/数据库/Qdrant 均在 bookmate-net 内网
# - SSE（聊天 / 流式问答）关闭缓冲，避免“憋一会儿一次性吐出来”
# - /metrics 只允许内网抓取
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time ut=$upstream_response_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;
    client_max_body_size 25m;
    client_body_timeout 60s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml application/x-ndjson;

    # 每 IP 30 r/s，允许 60 的突发；LLM 接口另有应用层限流
    limit_req_zone $binary_remote_addr zone=bookmate_api:10m rate=30r/s;
    limit_req_status 429;

    upstream bookmate_api {
        server api:8000;
        keepalive 32;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        # 安全响应头（HSTS 仅在启用 HTTPS 后打开，见文件末尾）
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # 健康检查不写访问日志，避免刷屏
        location = /healthz {
            access_log off;
            proxy_pass http://bookmate_api;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Prometheus 只允许容器/内网访问
        location = /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://bookmate_api;
        }

        # 聊天 SSE
        location /api/v1/chat/ {
            proxy_pass http://bookmate_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 流式问答 SSE（与聊天同策略）
        location = /api/v1/rag/ask/stream {
            proxy_pass http://bookmate_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 后台上传：PDF 解析 + 切片 + 向量化可能超过默认 120s
        location = /api/v1/rag/ingest/upload {
            proxy_pass http://bookmate_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            client_max_body_size 25m;
        }

        # 静态资源由应用直接返回；浏览器缓存 1 小时
        location /static/ {
            proxy_pass http://bookmate_api;
            proxy_set_header Host $http_host;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            add_header X-Content-Type-Options nosniff always;
        }

        location / {
            limit_req zone=bookmate_api burst=60 nodelay;
            proxy_pass http://bookmate_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
        }
    }

    # ---- HTTPS（有域名与证书时启用；腾讯云可用 certbot 或云证书） ----
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name bookmate.example.com;
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_session_cache shared:SSL:10m;
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     # 其余 location 与上面 80 端口一致（可抽到 conf.d 共用）
    # }
}
