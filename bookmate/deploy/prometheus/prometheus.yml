# 可选监控：docker compose ... --profile monitoring up -d
# 抓取 API 的 /metrics（容器内网），不经过 Nginx 公网出口。
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    service: bookmate

scrape_configs:
  - job_name: bookmate-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
