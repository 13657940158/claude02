# 生产栈（CPU 侧）：MySQL + Redis + Qdrant + 一次性 init + API + 语料 worker + Nginx
#
# 模型全部走在线 API，本文件不含任何模型/GPU 容器；GPU 侧见 docker-compose.gpu.yml。
# 用法（在项目根目录，.env 已填好）：
#   docker compose --env-file .env -f deploy/compose/docker-compose.cpu.yml up -d --build
#   docker compose --env-file .env -f deploy/compose/docker-compose.cpu.yml ps
#   docker compose --env-file .env -f deploy/compose/docker-compose.cpu.yml logs -f api
#
# 对外只暴露 Nginx（HTTP_PORT，默认 8080）；MySQL/Redis/Qdrant/API 均只在容器网络内。
name: bookmate-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-env: &app-env
  DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-bookmate}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-bookmate}?charset=utf8mb4
  DATABASE_SYNC_URL: mysql+pymysql://${MYSQL_USER:-bookmate}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-bookmate}?charset=utf8mb4
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  CORPUS_DIR: /app/data/books
  # 生产镜像内不跑 --reload；自举交给 init 容器，避免多个副本同时扫描
  AUTO_BOOTSTRAP: "false"

x-app-build: &app-build
  context: ../..
  dockerfile: Dockerfile
  args:
    BASE_IMAGE: ${BASE_IMAGE:-python:3.11-slim}
    PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    BASE_APT_MIRROR: ${BASE_APT_MIRROR:-}

services:
  mysql:
    image: mysql:8.0.40
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --innodb-ft-min-token-size=2
      - --max_connections=300
      - --innodb-buffer-pool-size=512M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 填写 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bookmate}
      MYSQL_USER: ${MYSQL_USER:-bookmate}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 填写 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2.0
    logging: *default-logging
    networks: [bookmate-net]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 320m
    cpus: 1.0
    logging: *default-logging
    networks: [bookmate-net]

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__ENABLE_STATIC_CONTENT: "false"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    logging: *default-logging
    networks: [bookmate-net]

  # 一次性：迁移 + 自举（管理员/种子书/语料入库/检索自检），成功后退出
  init:
    # 复用 api 构建的镜像；compose 会先完成 api 的 build 再启动
    image: bookmate-api:${IMAGE_TAG:-prod}
    env_file: ../../.env
    environment: *app-env
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        python scripts/bootstrap_cli.py --trigger deploy
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ${CORPUS_HOST_DIR:-../../data/books}:/app/data/books:ro
      # 黄金集只读；评测产物写入命名卷（appuser 可写，避免宿主机属主问题）
      - ${EVAL_DATASET_DIR:-../../eval/datasets}:/app/eval/datasets:ro
      - eval_reports:/app/eval/reports
      - eval_adjustments:/app/eval/adjustments
    restart: "no"
    # 一次性容器不提供 HTTP，关闭镜像自带健康检查
    healthcheck:
      disable: true
    mem_limit: 1g
    cpus: 2.0
    logging: *default-logging
    networks: [bookmate-net]

  api:
    build: *app-build
    image: bookmate-api:${IMAGE_TAG:-prod}
    env_file: ../../.env
    environment: *app-env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      # 后台上传需要写入语料目录；worker/init 仍只读
      - ${CORPUS_HOST_DIR:-../../data/books}:/app/data/books:rw
      - ${EVAL_DATASET_DIR:-../../eval/datasets}:/app/eval/datasets:ro
      - eval_reports:/app/eval/reports
      - eval_adjustments:/app/eval/adjustments
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2.0
    logging: *default-logging
    networks: [bookmate-net]

  # 语料巡检：投放到 $CORPUS_HOST_DIR 的新书会自动入库并接入检索
  worker:
    image: bookmate-api:${IMAGE_TAG:-prod}
    env_file: ../../.env
    environment: *app-env
    command: ["python", "-m", "app.workers.corpus_worker"]
    healthcheck:
      disable: true
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ${CORPUS_HOST_DIR:-../../data/books}:/app/data/books:ro
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    logging: *default-logging
    networks: [bookmate-net]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    logging: *default-logging
    networks: [bookmate-net]

  # 可选监控：docker compose ... --profile monitoring up -d
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging
    networks: [bookmate-net]

volumes:
  mysql_data:
  redis_data:
  qdrant_data:
  eval_reports:
  eval_adjustments:
  prometheus_data:

networks:
  bookmate-net:
    name: bookmate-net
