{% extends "base.html" %}

{% block title %}页面没有找到 · {{ app_name }}{% endblock %}

{% block content %}
<section class="error-page">
  <div class="error-code" aria-hidden="true">404</div>
  <div class="error-copy">
    <p class="eyebrow">NOT FOUND</p>
    <h1>这一页像书被借走了</h1>
    <p class="muted">地址可能写错了，或内容已经移动。你可以回到书架，或让墨舟推荐一本。</p>
    <div class="row-actions">
      <a class="btn btn-primary" href="/books">回到书架</a>
      <a class="btn btn-ghost" href="/">首页</a>
      <a class="btn btn-ghost" href="/chat">问问客服</a>
    </div>
  </div>
</section>
{% endblock %}
